name: Notify Pages repo of README change

on:
  push:
    branches: [main]
    paths:
      - 'README.md'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch to karlerikjonatan.github.io
        run: |
          curl -fsSL -X POST \
            -H "Authorization: token ${{ secrets.PAGES_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/karlerikjonatan/karlerikjonatan.github.io/dispatches \
            -d '{"event_type":"readme-updated"}'
